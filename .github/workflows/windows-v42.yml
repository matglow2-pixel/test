name: Build v42 screenshot sweep and cursor recovery

on:
  push:
    paths:
      - 'LoongLens-WindowsBuild-v42.zip'
      - '.github/workflows/windows-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract v42 and its v41 benchmark baseline
        shell: pwsh
        run: |
          Expand-Archive LoongLens-WindowsBuild-v42.zip -DestinationPath source
          Expand-Archive LoongLens-WindowsBuild-v41.zip -DestinationPath baseline
          Expand-Archive LoongLens-WindowsBuild-v37.zip -DestinationPath baseline-v37
      - name: Install pinned dependencies and build tools
        working-directory: source/LoongLens
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0 pefile==2023.2.7 py7zr==1.0.0
      - name: Size the disposable Windows validation desktop
        working-directory: source/LoongLens
        run: python tools/set_validation_display.py
      - name: Verify source GUI layout and shared controls on Windows
        working-directory: source/LoongLens
        run: python desktop_entry.py --gui-check-report source-gui-check.json
      - name: Verify native Spy UI with real detector and simulated route input
        working-directory: source/LoongLens
        run: python tools/ui_spy_smoke.py
      - name: Verify native daily collection UI and persistent quota
        working-directory: source/LoongLens
        run: python tools/ui_sniper_smoke.py
      - name: Verify native client borders and cursor confinement before building
        working-directory: source/LoongLens
        run: python desktop_entry.py --input-check-report source-input-check.json
      - name: Verify MuMu window selection, toolbar exclusion and delivered input
        working-directory: source/LoongLens
        run: python desktop_entry.py --mumu-check-report source-mumu-check.json
      - name: Verify native gameplay camera drags and safe gem clicks
        working-directory: source/LoongLens
        run: python desktop_entry.py --gem-recenter-check-report source-gem-recenter-check.json
      - name: Run Windows application tests
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object tests-result.txt
          exit $LASTEXITCODE
      - name: Test route removal and saved-route dropdown in native Tk
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_route_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_route_profiles_smoke.py
          exit $LASTEXITCODE
      - name: Compare v37, v41 and v42 on the full route
        shell: pwsh
        run: |
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline-v37/LoongLens --output source/LoongLens/artifacts/benchmark-v37.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline/LoongLens --output source/LoongLens/artifacts/benchmark-v41.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --output source/LoongLens/artifacts/benchmark-v42.json
          exit $LASTEXITCODE
      - name: Build Windows EXE
        working-directory: source/LoongLens
        run: python tools/build_windows_exe.py
      - name: Verify embedded icon
        working-directory: source/LoongLens
        run: python tools/check_exe_icon.py dist/LoongLens.exe LoongLens-WhiteIcon.ico
      - name: Verify frozen resources, GUI and Windows input
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/LoongLens.exe).Path
          foreach ($mode in @('self-check', 'gui-check', 'input-check', 'mumu-check', 'gem-recenter-check')) {
            $report = Join-Path $PWD "$mode.json"
            if (Test-Path $report) { Remove-Item $report }
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode-report", $report -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode exited with $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$mode did not write a report" }
            Get-Content $report
            if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw "$mode failed" }
          }
      - name: Create and verify complete 7z package
        working-directory: source/LoongLens
        run: python tools/package_full_windows.py --exe dist/LoongLens.exe --output dist/LoongLens-v42-Full.7z
      - name: Publish complete v42 package
        working-directory: source/LoongLens
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $existing = gh release view windows-exe-v42 --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a published release' }
            gh release upload windows-exe-v42 dist/LoongLens-v42-Full.7z dist/LoongLens-v42-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit windows-exe-v42 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --title "Loong Lens v42 - screenshot sweep and cursor recovery" --notes "Complete rebuilt Windows EXE plus all source/assets. Fast map sweep checks a ready screenshot in the background while moving on; a candidate releases any drag and returns to its saved camera view for fresh confirmation before one safe click. Keeps the original photo/time/location and one count. Loading fallback, last-image draining and F10 are bounded. Fixes the saved speed preference handoff. Transient pointer mismatches retry before mouse-down; disturbed drags retry the unfinished point with fresh recognition. Persistent input errors, moved windows, lost focus and F10 still stop with progress retained. Keeps 20s collection, Emerald Corner return, compact MuMu UI and mouse control. Keep MuMu visible and focused; no ADB. Full Windows tests, native source/frozen checks and comparisons against v37/v41 are included. Comparisons are simulated, not live MuMu measurements."
          } else {
            gh release create windows-exe-v42 dist/LoongLens-v42-Full.7z dist/LoongLens-v42-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --draft --prerelease --title "Loong Lens v42 - screenshot sweep and cursor recovery" --notes "Complete rebuilt Windows EXE plus all source/assets. Fast map sweep checks a ready screenshot in the background while moving on; a candidate releases any drag and returns to its saved camera view for fresh confirmation before one safe click. Keeps the original photo/time/location and one count. Loading fallback, last-image draining and F10 are bounded. Fixes the saved speed preference handoff. Transient pointer mismatches retry before mouse-down; disturbed drags retry the unfinished point with fresh recognition. Persistent input errors, moved windows, lost focus and F10 still stop with progress retained. Keeps 20s collection, Emerald Corner return, compact MuMu UI and mouse control. Keep MuMu visible and focused; no ADB. Full Windows tests, native source/frozen checks and comparisons against v37/v41 are included. Comparisons are simulated, not live MuMu measurements."
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: LoongLens-v42-Full
          path: source/LoongLens/dist/LoongLens-v42-Full.7z*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoongLens-v42-validation
          path: |
            source/LoongLens/tests-result.txt
            source/LoongLens/self-check.json
            source/LoongLens/gui-check.json
            source/LoongLens/input-check.json
            source/LoongLens/spy-ui-check.json
            source/LoongLens/sniper-ui-check.json
            source/LoongLens/source-gui-check.json
            source/LoongLens/source-input-check.json
            source/LoongLens/source-mumu-check.json
            source/LoongLens/mumu-check.json
            source/LoongLens/source-gem-recenter-check.json
            source/LoongLens/gem-recenter-check.json
            source/LoongLens/artifacts/benchmark-v37.json
            source/LoongLens/artifacts/benchmark-v41.json
            source/LoongLens/artifacts/benchmark-v42.json
            source/LoongLens/artifacts/v42-*.png
            source/LoongLens/build/LoongLens/warn-LoongLens.txt
