name: Build v37 map-state and filter fix

on:
  push:
    paths:
      - 'LoongLens-WindowsBuild-v37.zip'
      - '.github/workflows/windows-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract v37 and its v36 benchmark baseline
        shell: pwsh
        run: |
          Expand-Archive LoongLens-WindowsBuild-v37.zip -DestinationPath source
          Expand-Archive LoongLens-WindowsBuild-v36.zip -DestinationPath baseline
      - name: Install pinned dependencies and build tools
        working-directory: source/LoongLens
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0 pefile==2023.2.7 py7zr==1.0.0
      - name: Size the disposable Windows validation desktop
        working-directory: source/LoongLens
        run: python tools/set_validation_display.py
      - name: Verify source GUI layout and shared controls on Windows
        working-directory: source/LoongLens
        run: python desktop_entry.py --gui-check-report source-gui-check.json
      - name: Verify native Spy UI with real detector and simulated route input
        working-directory: source/LoongLens
        run: python tools/ui_spy_smoke.py
      - name: Verify native daily collection UI and persistent quota
        working-directory: source/LoongLens
        run: python tools/ui_sniper_smoke.py
      - name: Verify native client borders and cursor confinement before building
        working-directory: source/LoongLens
        run: python desktop_entry.py --input-check-report source-input-check.json
      - name: Run Windows application tests
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object tests-result.txt
          exit $LASTEXITCODE
      - name: Test route removal and saved-route dropdown in native Tk
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_route_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_route_profiles_smoke.py
          exit $LASTEXITCODE
      - name: Compare v36 and v37 on the full route
        shell: pwsh
        run: |
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline/LoongLens --output source/LoongLens/artifacts/benchmark-v36.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --output source/LoongLens/artifacts/benchmark-v37.json
          exit $LASTEXITCODE
      - name: Build Windows EXE
        working-directory: source/LoongLens
        run: python tools/build_windows_exe.py
      - name: Verify embedded icon
        working-directory: source/LoongLens
        run: python tools/check_exe_icon.py dist/LoongLens.exe LoongLens-WhiteIcon.ico
      - name: Verify frozen resources, GUI and Windows input
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/LoongLens.exe).Path
          foreach ($mode in @('self-check', 'gui-check', 'input-check')) {
            $report = Join-Path $PWD "$mode.json"
            if (Test-Path $report) { Remove-Item $report }
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode-report", $report -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode exited with $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$mode did not write a report" }
            Get-Content $report
            if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw "$mode failed" }
          }
      - name: Create and verify complete 7z package
        working-directory: source/LoongLens
        run: python tools/package_full_windows.py --exe dist/LoongLens.exe --output dist/LoongLens-v37-Full.7z
      - name: Publish complete v37 package
        working-directory: source/LoongLens
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release create windows-exe-v37 dist/LoongLens-v37-Full.7z dist/LoongLens-v37-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --draft --prerelease --title "Loong Lens v37 - Map state and filter recovery" --notes "Complete rebuilt Windows EXE plus all source/assets. Fixes the v36 stop where an already-open large map was mistaken for gameplay and the minimap tap opened its filter. Independent Back/zoom/world-tab evidence confirms the map when the title template fails. Rechecks a transitional frame before sending an opener. Existing filter panels receive one calibrated Back click; both panel-only close and full map close are observed before continuing. Recovery is bounded, keeps route progress and honors F10. An unclosed map cannot count as an inspected gem location. The v36 sidebar UI and original transparent gem artwork, saved routes, Obtained choices, daily count, Endless mode, 20-second collection, Emerald Corner return and Spy heatmap remain. Full Windows test suite includes real control-pixel regressions plus native source/frozen UI, input, Spy import and Sniper restart/endless checks. Game input in diagnostics is simulated."
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: LoongLens-v37-Full
          path: source/LoongLens/dist/LoongLens-v37-Full.7z*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoongLens-v37-validation
          path: |
            source/LoongLens/tests-result.txt
            source/LoongLens/self-check.json
            source/LoongLens/gui-check.json
            source/LoongLens/input-check.json
            source/LoongLens/spy-ui-check.json
            source/LoongLens/sniper-ui-check.json
            source/LoongLens/source-gui-check.json
            source/LoongLens/source-input-check.json
            source/LoongLens/artifacts/benchmark-v36.json
            source/LoongLens/artifacts/benchmark-v37.json
            source/LoongLens/artifacts/v37-*.png
            source/LoongLens/build/LoongLens/warn-LoongLens.txt
