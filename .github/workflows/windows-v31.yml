name: Build v31 with Gem Spy and persistent histories

on:
  push:
    paths:
      - 'LoongLens-WindowsBuild-v31.zip'
      - '.github/workflows/windows-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract v31 and its v30 benchmark baseline
        shell: pwsh
        run: |
          Expand-Archive LoongLens-WindowsBuild-v31.zip -DestinationPath source
          Expand-Archive LoongLens-WindowsBuild-v30.zip -DestinationPath baseline
      - name: Install pinned dependencies and build tools
        working-directory: source/LoongLens
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0 pefile==2023.2.7 py7zr==1.0.0
      - name: Verify native Spy UI with real detector and simulated route input
        working-directory: source/LoongLens
        run: python tools/ui_spy_smoke.py
      - name: Run Windows application tests
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object tests-result.txt
          exit $LASTEXITCODE
      - name: Test route removal and saved-route dropdown in native Tk
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_route_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_route_profiles_smoke.py
          exit $LASTEXITCODE
      - name: Compare v30 and v31 on the full route
        shell: pwsh
        run: |
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline/LoongLens --output source/LoongLens/artifacts/benchmark-v30.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --output source/LoongLens/artifacts/benchmark-v31.json
          exit $LASTEXITCODE
      - name: Build Windows EXE
        working-directory: source/LoongLens
        run: python tools/build_windows_exe.py
      - name: Verify embedded icon
        working-directory: source/LoongLens
        run: python tools/check_exe_icon.py dist/LoongLens.exe LoongLens-WhiteIcon.ico
      - name: Verify frozen resources, GUI and Windows input
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/LoongLens.exe).Path
          foreach ($mode in @('self-check', 'gui-check', 'input-check')) {
            $report = Join-Path $PWD "$mode.json"
            if (Test-Path $report) { Remove-Item $report }
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode-report", $report -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode exited with $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$mode did not write a report" }
            Get-Content $report
            if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw "$mode failed" }
          }
      - name: Create and verify complete 7z package
        working-directory: source/LoongLens
        run: python tools/package_full_windows.py --exe dist/LoongLens.exe --output dist/LoongLens-v31-Full.7z
      - name: Publish complete v31 package
        working-directory: source/LoongLens
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release create windows-exe-v31 dist/LoongLens-v31-Full.7z dist/LoongLens-v31-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --prerelease --title "Loong Lens v31 - Gem Spy and persistent histories" --notes "Tabs are Map Tweaker, Gem Sniper and Gem Spy. Gem Watch is removed; shared detection preferences, alerts and standard history remain available through Gem Sniper. Gem Spy uses the selected Sniper route/settings, observes continuously without clicking gems or stopping on a find, and records distinct continuing encounters with one standard history entry and original screenshot. Source is Gem Spy. Exclusive Spy history includes visits, appearance windows, last seen/missing, runs seen, hourly first-sighting counts by date and timing candidates with supporting evidence. State persists across restarts. Capture/alignment errors retry without resetting state; unclear checks never count as empty. Manual Stop/F10 remains stopped. Only one mouse controller can run. Centre-start dragging and removal of the portal restriction remain in the rebuilt EXE. Includes Windows tests, native GUI/input/F10, source Spy UI integration with real detector and simulated map input, complete frozen resource/icon checks and archive extraction verification. Full 7z includes EXE, source, assets, models, launchers, tests and validation. Game routes and timings are simulated; actual BlueStacks behavior and spawn schedules require observation."
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: LoongLens-v31-Full
          path: source/LoongLens/dist/LoongLens-v31-Full.7z*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoongLens-v31-validation
          path: |
            source/LoongLens/tests-result.txt
            source/LoongLens/self-check.json
            source/LoongLens/gui-check.json
            source/LoongLens/input-check.json
            source/LoongLens/spy-ui-check.json
            source/LoongLens/artifacts/benchmark-v30.json
            source/LoongLens/artifacts/benchmark-v31.json
            source/LoongLens/build/LoongLens/warn-LoongLens.txt
