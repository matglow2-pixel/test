name: Build v28 with faster map recognition and held movement

on:
  push:
    paths:
      - 'LoongLens-WindowsBuild-v28.zip'
      - '.github/workflows/windows-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract v28 and its v24, v26 and v27 benchmark baselines
        shell: pwsh
        run: |
          Expand-Archive LoongLens-WindowsBuild-v28.zip -DestinationPath source
          Expand-Archive LoongLens-WindowsBuild-v27.zip -DestinationPath baseline
          Expand-Archive LoongLens-WindowsBuild-v24.zip -DestinationPath baseline-v24
          Expand-Archive LoongLens-WindowsBuild-v26.zip -DestinationPath baseline-v26
      - name: Install pinned dependencies and build tools
        working-directory: source/LoongLens
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0 pefile==2023.2.7 py7zr==1.0.0
      - name: Run Windows application tests
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object tests-result.txt
          exit $LASTEXITCODE
      - name: Test route removal and saved-route dropdown in native Tk
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_route_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_route_profiles_smoke.py
          exit $LASTEXITCODE
      - name: Compare v24, v26, v27 and v28 on the full route
        shell: pwsh
        run: |
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline-v24/LoongLens --output source/LoongLens/artifacts/benchmark-v24.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline-v26/LoongLens --output source/LoongLens/artifacts/benchmark-v26.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline/LoongLens --output source/LoongLens/artifacts/benchmark-v27.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --output source/LoongLens/artifacts/benchmark-v28.json
          exit $LASTEXITCODE
      - name: Build Windows EXE
        working-directory: source/LoongLens
        run: python tools/build_windows_exe.py
      - name: Verify embedded icon
        working-directory: source/LoongLens
        run: python tools/check_exe_icon.py dist/LoongLens.exe LoongLens-WhiteIcon.ico
      - name: Verify frozen resources, GUI and Windows input
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/LoongLens.exe).Path
          foreach ($mode in @('self-check', 'gui-check', 'input-check')) {
            $report = Join-Path $PWD "$mode.json"
            if (Test-Path $report) { Remove-Item $report }
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode-report", $report -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode exited with $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$mode did not write a report" }
            Get-Content $report
            if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw "$mode failed" }
          }
      - name: Create and verify complete 7z package
        working-directory: source/LoongLens
        run: python tools/package_full_windows.py --exe dist/LoongLens.exe --output dist/LoongLens-v28-Full.7z
      - name: Publish complete v28 package
        working-directory: source/LoongLens
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release create windows-exe-v28 dist/LoongLens-v28-Full.7z dist/LoongLens-v28-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --prerelease --title "Loong Lens v28 - faster map opening and held movement" --notes "Speeds up map opening by counting recognition time toward the observation interval and reusing measured held frames for post-release confirmation. Faster held cursor motion and larger progress steps stop when the target is clickable. Removes the extra 8-pixel padding while retaining the marked exclusion boundary for the Loong Haven title, legend, portrait bubble, right strip and bottom controls. Stationary release, fresh-frame checks, F10, saved routes, point removal, inspection and gem confirmation remain. Windows tests, native Tk, frozen resources/GUI/icon and actual held-input/F10 checks passed before packaging. Includes EXE, source, models, assets, launchers, tools, tests and per-view validation reports. Atlas timings are simulations, not live BlueStacks speed."
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: LoongLens-v28-Full
          path: source/LoongLens/dist/LoongLens-v28-Full.7z*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoongLens-v28-validation
          path: |
            source/LoongLens/tests-result.txt
            source/LoongLens/self-check.json
            source/LoongLens/gui-check.json
            source/LoongLens/input-check.json
            source/LoongLens/artifacts/benchmark-v24.json
            source/LoongLens/artifacts/benchmark-v26.json
            source/LoongLens/artifacts/benchmark-v27.json
            source/LoongLens/artifacts/benchmark-v28.json
            source/LoongLens/build/LoongLens/warn-LoongLens.txt
