name: Build v39 faster persistent ADB capture

on:
  push:
    paths:
      - 'LoongLens-WindowsBuild-v39.zip'
      - '.github/workflows/windows-v39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract v39 and its v38 benchmark baseline
        shell: pwsh
        run: |
          Expand-Archive LoongLens-WindowsBuild-v39.zip -DestinationPath source
          Expand-Archive LoongLens-WindowsBuild-v38.zip -DestinationPath baseline
      - name: Install pinned dependencies and build tools
        working-directory: source/LoongLens
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0 pefile==2023.2.7 py7zr==1.0.0
      - name: Rebuild and verify the Android touch helper
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/build_android_touch.py --cache "$env:RUNNER_TEMP/loonglens-android-build" --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_touch_helper.py
          exit $LASTEXITCODE
      - name: Size the disposable Windows validation desktop
        working-directory: source/LoongLens
        run: python tools/set_validation_display.py
      - name: Verify source GUI layout and shared controls on Windows
        working-directory: source/LoongLens
        run: python desktop_entry.py --gui-check-report source-gui-check.json
      - name: Verify native Spy UI with real detector and simulated route input
        working-directory: source/LoongLens
        run: python tools/ui_spy_smoke.py
      - name: Verify native daily collection UI and persistent quota
        working-directory: source/LoongLens
        run: python tools/ui_sniper_smoke.py
      - name: Verify native client borders and cursor confinement before building
        working-directory: source/LoongLens
        run: python desktop_entry.py --input-check-report source-input-check.json
      - name: Verify native ADB settings and background transport
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_adb_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item adb-check.json source-adb-check.json
      - name: Run Windows application tests
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object tests-result.txt
          exit $LASTEXITCODE
      - name: Test route removal and saved-route dropdown in native Tk
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          python tools/ui_route_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_route_profiles_smoke.py
          exit $LASTEXITCODE
      - name: Compare v38 and v39 on the full route
        shell: pwsh
        run: |
          python source/LoongLens/tools/benchmark_sniping.py --app-root baseline/LoongLens --output source/LoongLens/artifacts/benchmark-v38.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/LoongLens/tools/benchmark_sniping.py --output source/LoongLens/artifacts/benchmark-v39.json
          exit $LASTEXITCODE
      - name: Compare v38 and v39 Android capture transport
        working-directory: source/LoongLens
        run: python tools/benchmark_adb_capture.py --baseline-root ../../baseline/LoongLens
      - name: Build Windows EXE
        working-directory: source/LoongLens
        run: python tools/build_windows_exe.py
      - name: Verify embedded icon
        working-directory: source/LoongLens
        run: python tools/check_exe_icon.py dist/LoongLens.exe LoongLens-WhiteIcon.ico
      - name: Verify frozen resources, GUI and Windows input
        working-directory: source/LoongLens
        shell: pwsh
        run: |
          $env:LOONGLENS_DIAGNOSTIC_PYTHON = (Get-Command python).Source
          $exe = (Resolve-Path dist/LoongLens.exe).Path
          foreach ($mode in @('self-check', 'gui-check', 'input-check', 'adb-check')) {
            $report = Join-Path $PWD "$mode.json"
            if (Test-Path $report) { Remove-Item $report }
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode-report", $report -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode exited with $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$mode did not write a report" }
            Get-Content $report
            if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw "$mode failed" }
          }
      - name: Create and verify complete 7z package
        working-directory: source/LoongLens
        run: python tools/package_full_windows.py --exe dist/LoongLens.exe --output dist/LoongLens-v39-Full.7z
      - name: Publish complete v39 package
        working-directory: source/LoongLens
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release create windows-exe-v39 dist/LoongLens-v39-Full.7z dist/LoongLens-v39-Full.7z.sha256 --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT --draft --prerelease --title "Loong Lens v39 - Faster ADB screenshots" --notes "Complete rebuilt Windows EXE plus all source/assets. Replaces v38's per-screenshot ADB launches with one persistent request-driven Android screen connection, also reused for foreground-app queries. Measures PNG versus raw transfer/decoding on connection and selects the faster supported format. Each frame is captured after its request; no queued video/stale screenshots. Exact OpenCV black-screen statistics remove repeated full-image float allocations. Existing route, map checks, inspection/confirmation and collection waits remain. Sniper/Spy keep the Windows mouse and foreground untouched; minimized operation requires BlueStacks to keep rendering. Settings preview includes capture milliseconds. Full Windows tests and source/frozen UI, persistent screen/process reuse, cancellation and cursor/focus checks are included. Capture benchmark uses simulated Android and modeled latency; live BlueStacks speed is not claimed. All source/assets and reports are included."
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: LoongLens-v39-Full
          path: source/LoongLens/dist/LoongLens-v39-Full.7z*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoongLens-v39-validation
          path: |
            source/LoongLens/adb-capture-benchmark.json
            source/LoongLens/source-adb-check.json
            source/LoongLens/adb-check.json
            source/LoongLens/touch-helper-check.json
            source/LoongLens/tests-result.txt
            source/LoongLens/self-check.json
            source/LoongLens/gui-check.json
            source/LoongLens/input-check.json
            source/LoongLens/spy-ui-check.json
            source/LoongLens/sniper-ui-check.json
            source/LoongLens/source-gui-check.json
            source/LoongLens/source-input-check.json
            source/LoongLens/artifacts/benchmark-v38.json
            source/LoongLens/artifacts/benchmark-v39.json
            source/LoongLens/artifacts/v39-*.png
            source/LoongLens/build/LoongLens/warn-LoongLens.txt
